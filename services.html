<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Services | PEAKFUND ADVISORS</title>
    
    <!-- FAVICON -->
    <link rel="icon" type="image/png" href="images/favicon.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800;900&family=Inter:wght@400;500;600&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Jellop-Style Staggered Layout with Images */
        .service-row { display: flex; gap: 60px; margin-bottom: 100px; align-items: center; }
        .service-row:nth-child(even) { flex-direction: row-reverse; }
        
        .service-text { flex: 1; }
        
        .service-badge { display: inline-block; background: var(--warm-ivory); color: var(--gold); font-family: 'Poppins', sans-serif; font-weight: 800; font-size: 0.75rem; padding: 6px 12px; border-radius: 20px; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 20px; border: 1px solid #F5A623;}
        
        .service-text h2 { font-size: 2.5rem; color: var(--navy); margin-bottom: 20px; display: flex; align-items: center; gap: 15px; font-family: 'Poppins', sans-serif; font-weight: 900;}
        .service-text h2 span { font-size: 4rem; color: transparent; -webkit-text-stroke: 2px var(--sky-blue); opacity: 0.6;}
        
        .service-text p { font-size: 1.1rem; color: var(--text-muted); margin-bottom: 20px; line-height: 1.7; }
        
        /* Deliverable Badges */
        .deliverables { display: flex; flex-wrap: wrap; gap: 10px; margin: 25px 0; }
        .deliverables span { background: var(--white); color: var(--navy); font-size: 0.85rem; padding: 6px 12px; border-radius: 4px; font-weight: 600; border: 1px solid #E2E8F0; box-shadow: 0 2px 5px rgba(0,0,0,0.02);}
        .deliverables span i { color: var(--sky-blue); margin-right: 5px; }
        
        .price-tag { font-family: 'Poppins', sans-serif; font-weight: 800; font-size: 1rem; color: var(--navy); margin-bottom: 20px; display: block; background: #F0F4F8; padding: 10px 15px; border-radius: 4px; border-left: 3px solid var(--gold);}
        
        .service-btn { display: inline-block; background: var(--navy); color: var(--white); padding: 12px 25px; border-radius: 4px; text-decoration: none; font-family: 'Poppins', sans-serif; font-weight: 800; font-size: 0.95rem; transition: background 0.3s;}
        .service-btn:hover { background: var(--gold); color: var(--navy); }
        
        .service-visual { flex: 1; background: var(--white); border-radius: 16px; padding: 20px; text-align: center; border: 1px solid #E2E8F0; box-shadow: 0 15px 40px rgba(0,0,0,0.06); transition: transform 0.3s;}
        .service-visual:hover { transform: translateY(-5px); }
        .service-visual img { width: 100%; height: 300px; object-fit: cover; border-radius: 12px; margin-bottom: 20px; }
        .service-visual h3 { color: var(--navy); font-size: 1.5rem; margin-bottom: 10px; font-family: 'Poppins', sans-serif; font-weight: 800;}

        /* FULL WIDTH CTA SECTION */
        .cta-full-width { 
            width: 100%; 
            padding: 80px 5% 100px 5%; 
            background: transparent; 
            text-align: center;
        }
        .cta-full-width h3 { 
            font-family: 'Poppins', sans-serif; 
            font-weight: 900; 
            font-size: 3rem; 
            color: var(--navy); 
            margin-bottom: 20px; 
            line-height: 1.1;
        }
        .cta-full-width p { 
            color: var(--text-muted); 
            font-size: 1.2rem; 
            max-width: 800px;
            margin: 0 auto 40px auto; 
            line-height: 1.6;
        }
        .cta-full-width .btn { 
            background: var(--gold); 
            color: var(--navy); 
            padding: 18px 40px; 
            border-radius: 6px; 
            font-family: 'Poppins', sans-serif; 
            font-weight: 800; 
            font-size: 1.1rem; 
            text-decoration: none;
            display: inline-block;
            transition: transform 0.3s, background 0.3s;
            box-shadow: 0 4px 15px rgba(245, 166, 35, 0.3);
            border: 2px solid var(--gold);
        }
        .cta-full-width .btn:hover { 
            transform: translateY(-3px); 
            background: var(--navy); 
            color: var(--white); 
            border-color: var(--navy);
        }
        
        /* FOOTER STYLES */
        footer { background: var(--navy); color: var(--white); padding: 80px 5% 30px 5%; border-top: 5px solid var(--gold); width: 100%; }
        .footer-grid { display: grid; grid-template-columns: 2fr 1fr 1fr 1.5fr; gap: 40px; max-width: 1200px; margin: 0 auto 60px auto; }
        .footer-brand h3 { font-family: 'Poppins', sans-serif; font-weight: 900; font-size: 1.8rem; color: var(--gold); margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1px;}
        .footer-brand p { color: #A0AEC0; font-size: 0.95rem; line-height: 1.6; margin-bottom: 20px; }
        .footer-links h4, .footer-newsletter h4 { font-family: 'Poppins', sans-serif; font-weight: 800; font-size: 1.1rem; margin-bottom: 20px; color: var(--white); text-transform: uppercase; letter-spacing: 1px;}
        .footer-links ul { list-style: none; padding: 0; margin: 0;}
        .footer-links li { margin-bottom: 12px; }
        .footer-links a { color: #A0AEC0; text-decoration: none; font-size: 0.95rem; transition: color 0.3s; }
        .footer-links a:hover { color: var(--gold); padding-left: 5px; }
        .footer-newsletter p { color: #A0AEC0; font-size: 0.95rem; margin-bottom: 15px; }
        .newsletter-form { display: flex; gap: 10px; }
        .newsletter-form input { flex: 1; padding: 12px; border-radius: 4px; border: 1px solid #2D3748; background: #1A365D; color: var(--white); font-family: 'Inter', sans-serif; outline: none; }
        .newsletter-form input::placeholder { color: #718096; }
        .newsletter-form button { background: var(--gold); color: var(--navy); border: none; padding: 12px 20px; border-radius: 4px; font-weight: 800; font-family: 'Poppins', sans-serif; cursor: pointer; transition: transform 0.2s; }
        .newsletter-form button:hover { transform: scale(1.05); }
        .footer-bottom { border-top: 1px solid #2D3748; padding-top: 30px; display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto; flex-wrap: wrap; gap: 20px;}
        .footer-bottom p { color: #718096; font-size: 0.9rem; }
        .social-icons { display: flex; gap: 15px; }
        .social-icons a { color: var(--white); font-size: 1.2rem; background: #1A365D; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 50%; text-decoration: none; transition: all 0.3s; }
